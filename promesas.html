<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Animaciones y promesas</title>
    <style>
      @keyframes bounce {
        0%,
        100% {
          transform: translateY(0);
        }
        30% {
          transform: translateY(-45px);
        }
        70% {
          transform: translateY(-22px);
        }
      }
      .ball {
        width: 70px;
        height: 70px;
        border-radius: 50%;
        background: orange;
      }
      #msg {
        margin-top: 1rem;
        font-family: sans-serif;
        min-height: 1.4rem;
      }
    </style>
  </head>
  <body>
    <div class="ball" id="ball"></div>
    <div id="msg"></div>
    <button onclick="animarYavisar()">Animar y esperar</button>

    <script>
      // Envolvemos el evento animationend en una promesa
      function animar(el, keyframes) {
        return new Promise((resolve) => {
          el.addEventListener("animationend", resolve, { once: true });
          el.style.animation = keyframes;
        });
      }

      async function animarYavisar() {
        const ball = document.getElementById("ball");
        const msg = document.getElementById("msg");
        msg.textContent = "";
        ball.style.animation = "none";
        void ball.offsetWidth; // reinicio

        await animar(ball, "bounce 1.1s ease"); // espera a que termine
        msg.textContent = "¡Animación terminada! (este texto corre después)";
        ball.style.animation = "";
      }
    </script>
  </body>
</html>
