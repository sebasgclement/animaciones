<!doctype html>

    <meta charset="UTF-8" />

    <title>Responsive design</title>
    <style>
      body {
        margin: 0;
      }

      .grail {
        display: grid;
        min-height: 100vh;
        grid-template:
          "header header header" auto
          "nav    main   aside" 1fr
          "footer footer footer" auto
          / 200px 1fr 200px;
        gap: 8px;
        padding: 8px;
      }

      header {
        grid-area: header;
        background: #1a1d24;
      }
      nav {
        grid-area: nav;
        background: #a8442a;
      }
      main {
        grid-area: main;
        background: #2d6a5a;
      }
      aside {
        grid-area: aside;
        background: #a8442a;
      }
      footer {
        grid-area: footer;
        background: #1a1d24;
      }

      header,
      nav,
      main,
      aside,
      footer {
        color: #fff;
        padding: 1rem;
        text-align: center;
        border-radius: 6px;
      }

      /* Mobile: todo apilado en una columna */
      @media (max-width: 768px) {
        .grail {
          grid-template:
            "header" auto
            "nav" auto
            "main" 1fr
            "aside" auto
            "footer" auto
            / 1fr;
        }
      }
