<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Scroll reveal</title>
    <style>
      .reveal {
        opacity: 0;
        transform: translateY(30px);
        transition:
          opacity 0.6s ease,
          transform 0.6s ease;
      }
      .reveal.visible {
        opacity: 1;
        transform: translateY(0);
      }
      .caja {
        height: 200px;
        margin: 40vh 0;
        background: seagreen;
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2rem;
      }
    </style>
  </head>
  <body>
    <div class="reveal caja">Aparezco 1</div>
    <div class="reveal caja">Aparezco 2</div>
    <div class="reveal caja">Aparezco 3</div>

    <script>
      const obs = new IntersectionObserver(
        (entries) => {
          entries.forEach((e) => {
            if (e.isIntersecting) e.target.classList.add("visible");
          });
        },
        { threshold: 0.3 },
      );
      document.querySelectorAll(".reveal").forEach((el) => obs.observe(el));
    </script>
  </body>
</html>
